# Publishes the browser log viewer (web/) to GitHub Pages, together with the Python modules it
# runs in the browser (recording.py, analyse.py).
name: Deploy web viewer

on:
  push:
    branches: [main]
    paths: ["web/**", "recording.py", "analyse.py", "defs.py", "dtc.py", "capture.py", "guided.py", "report.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p _site/py
          cp -r web/* _site/
          cp recording.py analyse.py defs.py dtc.py capture.py guided.py report.py _site/py/
          # Make browsers fetch fresh copies after every deploy (Pages lets them cache for 10 min).
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
