# Publishes the browser log viewer (web/) to GitHub Pages, together with the Python modules it
# runs in the browser (recording.py, analyse.py).
name: Deploy web viewer

on:
  push:
    branches: [main]
    paths: ["web/**", "recording.py", "analyse.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/py
          cp -r web/* _site/
          cp recording.py analyse.py _site/py/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
